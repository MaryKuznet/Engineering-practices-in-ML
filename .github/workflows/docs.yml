name: docs

on:
  push:
    branches:
      - main
      - Homework_6
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.4
        with:
          pixi-version: latest
          cache: true

      - name: Install env
        run: pixi install

      - name: Generate experiment report
        run: pixi run report

      - name: Build MkDocs site
        run: pixi run docs-build

      - name: Deploy to GitHub Pages
        run: pixi run mkdocs gh-deploy --force
