[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
select = ["E", "F", "W"]
ignore = ["E501"]
line-length = 88
src = ["src"]
exclude = ["data", "notebooks"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.bandit]
skips = ["B101"]
