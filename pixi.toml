[workspace]
channels = ["conda-forge"]
name = "Engineering-practices-in-ML"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
format = "black . && isort ."
lint = "ruff check ."
types = "mypy src"
security = "bandit -r src"
precommit = "pre-commit run --all-files"
train = "python -m src.train"
docs = "mkdocs serve -a 127.0.0.1:8000"
docs-build = "mkdocs build --strict"
report = "python -m src.reports.build_report"
repro = "pixi run dvc pull && pixi run train && pixi run report && pixi run docs-build"

[dependencies]
python = "3.11.*"
black = ">=25.1.0,<26"
isort = ">=7.0.0,<8"
ruff = ">=0.14.5,<0.15"
mypy = ">=1.18.2,<2"
bandit = ">=1.9.1,<2"
pre-commit = ">=4.4.0,<5"
numpy = ">=2.3.5,<3"
pandas = ">=2.3.3,<3"
scikit-learn = ">=1.7.2,<2"
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.10.8,<4"
dvc = ">=3.64.2,<4"
mlflow = ">=3.7.0,<4"
joblib = ">=1.5.3,<2"
hydra-core = ">=1.3.2,<2"
omegaconf = ">=2.3.0,<3"
clearml = ">=2.1.0,<3"
clearml-agent = ">=2.0.5,<3"
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.6,<10"
pymdown-extensions = ">=10.14,<11"
